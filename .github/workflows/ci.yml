name: MLWR and OpenFHE correctness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      parameters:
        description: 'Optional key=value settings, separated by semicolons; blank uses defaults'
        required: false
        type: string

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Cache pinned OpenFHE
        id: cache
        uses: actions/cache@v4
        with:
          path: .deps/openfhe-install
          key: openfhe-b59e1f2-ubuntu24-gcc13-native64-static-noomp-v1
      - name: Build pinned OpenFHE
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build_openfhe.sh
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOpenFHE_DIR="$PWD/.deps/openfhe-install/lib/OpenFHE"
          cmake --build build --parallel 4
      - name: Test and record parameters
        run: |
          ctest --test-dir build --output-on-failure
          python3 scripts/compare_parameters.py build/evidence/openfhe-reference.json build/evidence/mlwr.json
          c++ --version > build/evidence/compiler.txt
          uname -a > build/evidence/platform.txt
          git rev-parse HEAD > build/evidence/commit.txt
      # Correctness must pass before benchmarking begins. Timings are
      # per-machine observations, not a cross-machine algorithm speedup.
      - name: Record stage timings after correctness
        run: |
          python3 scripts/run_experiment.py build/evidence/experiment build/mlwr_experiment --samples 15 --warmups 2
          python3 scripts/verify_experiment.py build/evidence/experiment/experiment.json
      - name: Record an unequal-dimension experiment
        run: |
          python3 scripts/run_experiment.py build/evidence/experiment-l3-k2 build/mlwr_experiment \
            --config configs/l3-k2-n32768.conf --key-trials 1
          python3 scripts/verify_experiment.py build/evidence/experiment-l3-k2/experiment.json
      - name: Run user parameters
        if: github.event_name == 'workflow_dispatch' && inputs.parameters != ''
        env:
          MLWR_USER_PARAMETERS: ${{ inputs.parameters }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path("build/user.conf").write_text(os.environ["MLWR_USER_PARAMETERS"].replace(";", "\n"))'
          python3 scripts/run_experiment.py build/evidence/experiment-custom build/mlwr_experiment --config build/user.conf
          python3 scripts/verify_experiment.py build/evidence/experiment-custom/experiment.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-evidence-linux
          path: |
            build/evidence/
            build/Testing/Temporary/LastTest.log
